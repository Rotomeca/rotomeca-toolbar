<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title data-i18n="window.add">Ajouter une application</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
      }

      #layout {
        height: 100%;
        width: calc(100% - 40px);
        padding: 0 20px;
        color: var(--ds-text-default);
        background-color: var(--ds-background-surface);
        /* border-radius: 8px; */
      }

      #predefined-apps {
        width: 100%;
        display: flex;
        justify-content: space-evenly;
      }

      rotomeca-toolbar-button {
        padding: 0;
      }
    </style>
    <link rel="stylesheet" href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css" />
    <link rel="stylesheet" href="../css/ds-compat.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <script src="./page.js" type="module"></script>
    <link rel="stylesheet" href="../css/fonts/icofont/icofont.min.css" />
  </head>
  <body>
    <div id="layout">
      <h1 style="margin-top: 0; padding-top: 10px" data-i18n="add.popular">Populaire</h1>
      <div id="predefined-apps"></div>
      <h1 data-i18n="add.search">Chercher un lien</h1>
      <div id="search">
        <iframe
          sandbox="allow-scripts allow-forms allow-popups"
          style="
            width: 100%;
            height: 313px;
            border: none;
            border-radius: 15px;
            background-color: white;
          "
          data-src="./search.html"
        ></iframe>
      </div>
    </div>
  </body>
  <footer></footer>
</html>
