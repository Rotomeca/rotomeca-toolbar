<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cse.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://www.google.com https://fonts.googleapis.com https://www.gstatic.com; img-src 'self' data: https: http://clients1.google.com; font-src https://fonts.gstatic.com data:; frame-src https://www.google.com https://cse.google.com; connect-src https://*.google.com https://*.googleapis.com; object-src 'none'; base-uri 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title>Ajouter une application</title>
    <style id="rotomeca-hide">
      html {
        visibility: hidden;
      }
    </style>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <script
      async
      src="https://cse.google.com/cse.js?cx=b2532872584184b5c"
    ></script>
    <div class="gcse-search"></div>
    <!--
      Script inline volontairement : cette page est dans une iframe sandboxée
      (origine opaque, sans accès à l'IPC) qui ne peut pas charger de fichier
      local (« Not allowed to load local resource »). Elle demande l'ajout d'un
      lien à la page parente par postMessage ; la page parente valide la demande.
      En retour, la page parente lui envoie le thème (jetons --ds-* résolus et
      feuille google-search.css), les libellés et les sites déjà dans la barre.
    -->
    <script>
      (function () {
        var MESSAGE_ADD = 'requestAddData';
        var MESSAGE_ADD_EDIT = 'requestAddDataEdit';
        var MESSAGE_READY = 'rotomecaSearchReady';
        var MESSAGE_THEME = 'rotomecaTheme';
        var MESSAGE_SAVED = 'rotomecaSaved';

        // Icônes Lucide (pencil, plus, check), en SVG en ligne : elles héritent de la couleur du bouton
        var SVG_OPEN =
          '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
        var ICONS = {
          pencil:
            SVG_OPEN +
            '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>',
          plus: SVG_OPEN + '<path d="M5 12h14"/><path d="M12 5v14"/></svg>',
          check: SVG_OPEN + '<path d="M20 6 9 17l-5-5"/></svg>',
        };

        // Libellés et adresses déjà ajoutées, fournis par la page parente
        var labels = { add: '', customize: '', added: '' };
        var saved = {};

        function normalize(url) {
          try {
            var parsed = new URL(url);
            return (
              parsed.origin + parsed.pathname.replace(/\/$/, '') + parsed.search
            );
          } catch (error) {
            return String(url);
          }
        }

        function createButton(icon, label, primary, type, name, url) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'rotomeca-btn' + (primary ? ' primary' : '');
          button.title = label;
          button.setAttribute('aria-label', label);
          button.innerHTML = ICONS[icon];

          button.addEventListener('click', function () {
            parent.postMessage({ type: type, name: name, url: url }, '*');
          });

          return button;
        }

        /**
         * (Re)construit les actions d'un résultat : crayon + « + », ou « Ajouté » si le site est déjà dans la barre.
         */
        function renderActions(actions) {
          var url = actions.getAttribute('data-url');
          var name = actions.getAttribute('data-name');
          actions.textContent = '';

          if (saved[normalize(url)]) {
            var tag = document.createElement('span');
            tag.className = 'rotomeca-added';
            tag.innerHTML = ICONS.check;
            tag.appendChild(document.createTextNode(labels.added));
            actions.appendChild(tag);
            return;
          }

          actions.appendChild(
            createButton('pencil', labels.customize, false, MESSAGE_ADD_EDIT, name, url),
          );
          actions.appendChild(
            createButton('plus', labels.add, true, MESSAGE_ADD, name, url),
          );
        }

        function refreshActions() {
          document
            .querySelectorAll('.rotomeca-actions')
            .forEach(renderActions);
        }

        function decorate() {
          // Neutralise les liens des résultats : on ne navigue pas dans l'iframe
          document
            .querySelectorAll(
              '.gsc-results-wrapper-nooverlay.gsc-results-wrapper-visible a',
            )
            .forEach(function (link) {
              if (link.hasAttribute('href')) {
                link.setAttribute('data-href', link.getAttribute('href'));
                link.removeAttribute('href');
              }
              link.style.pointerEvents = 'none';
            });

          // Deux actions par résultat, réinjectées à chaque rendu du widget (recherche, page suivante)
          document
            .querySelectorAll('.gsc-webResult a.gs-title')
            .forEach(function (link) {
              var result = link.closest('.gsc-webResult');
              if (!result || result.querySelector('.rotomeca-actions')) return;

              var url = link.getAttribute('data-href');
              if (!url) return;

              var actions = document.createElement('div');
              actions.className = 'rotomeca-actions';
              actions.setAttribute('data-url', url);
              actions.setAttribute('data-name', link.textContent);
              result.appendChild(actions);
              renderActions(actions);
            });
        }

        // Thème, habillage Google, libellés et sites déjà ajoutés viennent de la page parente
        window.addEventListener('message', function (event) {
          if (event.source !== parent) return;
          var data = event.data || {};

          if (data.type === MESSAGE_THEME) {
            var root = document.documentElement;
            var tokens = data.tokens || {};
            Object.keys(tokens).forEach(function (name) {
              if (/^--ds-[a-z-]+$/.test(name))
                root.style.setProperty(name, String(tokens[name]));
            });
            root.style.colorScheme = data.scheme === 'light' ? 'light' : 'dark';

            var style = document.getElementById('rotomeca-theme');
            if (!style) {
              style = document.createElement('style');
              style.id = 'rotomeca-theme';
              document.head.appendChild(style);
            }
            style.textContent = String(data.css || '');

            var texts = data.labels || {};
            labels.add = String(texts.add || '');
            labels.customize = String(texts.customize || '');
            labels.added = String(texts.added || '');
            refreshActions();

            // Révèle la page une fois habillée (évite un éclair de widget blanc)
            document.getElementById('rotomeca-hide').remove();
          } else if (data.type === MESSAGE_SAVED && Array.isArray(data.urls)) {
            saved = {};
            data.urls.forEach(function (url) {
              saved[normalize(url)] = true;
            });
            refreshActions();
          }
        });

        // Sans réponse de la page parente, on affiche quand même le widget
        setTimeout(function () {
          var hide = document.getElementById('rotomeca-hide');
          if (hide) hide.remove();
        }, 2000);

        var observer = new MutationObserver(function () {
          // Évite de se redéclencher sur nos propres modifications du DOM
          observer.disconnect();
          decorate();
          observer.observe(document.body, { childList: true, subtree: true });
        });

        observer.observe(document.body, { childList: true, subtree: true });

        parent.postMessage({ type: MESSAGE_READY }, '*');
      })();
    </script>
  </body>
  <footer></footer>
</html>
