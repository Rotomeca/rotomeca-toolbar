<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title>Ajouter une application</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        color: var(--color-scheme-text, black);
        background-color: var(--color-scheme, white);
      }

      #layout {
        padding: 10px 25px;
      }

      rds-input-text,
      rds-input-file {
        display: block;
        margin-bottom: 20px;
      }
    </style>
    <link rel="stylesheet" href="./add.css" />
    <link
      rel="stylesheet"
      href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css"
    />
    <link rel="stylesheet" href="../css/ds-bridge.css" />
    <script type="module" src="../scripts/ds.js"></script>
  </head>
  <body>
    <div id="layout">
      <rds-input-text id="urlbox" placeholder="https://">Url</rds-input-text>
      <rds-input-text id="namebox">Nom du site</rds-input-text>
      <rds-input-file id="picturebox" accept="image/*">
        Icône
        <span slot="hint">Optionnelle : le favicon du site est utilisé par défaut</span>
      </rds-input-file>
      <rds-button id="clear" variant="tertiary" icon-before="trash-2" disabled>
        Retirer l'icône
      </rds-button>
      <div style="text-align: center; margin-top: 20px">
        <rds-primary-button id="save">Sauvegarder</rds-primary-button>
      </div>
    </div>
  </body>
  <footer>
    <script type="module" src="./main.js"></script>
  </footer>
</html>
