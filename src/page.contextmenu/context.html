<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title>Applications</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #layout {
        width: calc(100% - 2px);
        height: calc(100% - 2px);
        background-color: var(--ds-background-overlay);
        border-radius: 10px;
        border: 1px solid var(--ds-border-strong);
        display: flex;
        flex-direction: column;
      }

      rds-button {
        display: block;
      }

      rds-button::part(button) {
        width: 100%;
        height: 30px;
        min-height: 30px;
        padding-block: 0;
        border-radius: 0;
        justify-content: flex-start;
      }

      rds-button:first-of-type::part(button) {
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
      }

      rds-button:last-of-type::part(button) {
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
      }
    </style>
    <link
      rel="stylesheet"
      href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css"
    />
    <link rel="stylesheet" href="../css/ds-compat.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <script src="./main.js" type="module"></script>
  </head>
  <body>
    <div id="layout"></div>
  </body>
  <footer></footer>
</html>
