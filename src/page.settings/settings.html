<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title data-i18n="window.settings">Applications</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-image: url('../pictures/background.png');
        background-size: cover;
      }
      body {
        display: flex;
      }

      #toolbar {
        border-radius: 10px;
        margin-top: 10px;
        margin-left: 10px;
        width: 42px;
        height: calc(100% - 50px);
        color: var(--color-scheme-text, black);
        background-color: var(--color-scheme, white);
        margin-bottom: 10px;
      }

      #add {
        margin-top: 10px;
        margin-left: 5px;
        margin-bottom: 10px;
        pointer-events: none;
      }

      rds-divider {
        margin: 0 15px;
      }

      rotomeca-toolbar-button {
        pointer-events: none;
        padding: 0;
        margin: 5px;
        width: 30px;
      }

      rotomeca-toolbar-button {
        margin-top: 10px;
      }

      html.without-button #up {
        display: none;
      }

      html.without-button #toolbar {
        height: calc(100% - 20px);
      }

      #up {
        margin-left: 10px;
        pointer-events: none;
      }

      #up::part(button) {
        width: 42px;
        height: 28px;
        border-radius: 8px 8px 0 0;
      }

      .setting-group {
        margin-top: 15px;
      }

      #settings {
        width: 100%;
        height: calc(100% - 40px);
        background-color: var(--color-scheme);
        color: var(--color-scheme-text);
        border-radius: 10px;
        margin: 10px;
        padding: 10px;
      }
    </style>
    <script
      src="../scripts/components/HTMLToolbarButton.js"
      type="module"
    ></script>
    <link
      rel="stylesheet"
      href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css"
    />
    <link rel="stylesheet" href="../css/ds-bridge.css" />
    <script src="../scripts/ds.js" type="module"></script>
    <script src="./settings.js" type="module"></script>
    <link rel="stylesheet" href="../css/fonts/icofont/icofont.min.css" />
  </head>
  <body>
    <div style="display: flex; flex-direction: column; height: 100%">
      <div id="toolbar">
        <rds-icon-button
          id="add"
          variant="primary"
          size="sm"
          square
          icon="plus"
          label="Ajouter une application"
          data-i18n-label="toolbar.add"
        ></rds-icon-button>
        <rds-divider spacing="sm"></rds-divider>
        <rotomeca-toolbar-button
          data-title="Reddit"
          data-picture="font:reddit"
          data-url="nop"
        ></rotomeca-toolbar-button>
        <rotomeca-toolbar-button
          data-title="Reddit"
          data-picture="font:reddit"
          data-url="nop"
          data-pressed="true"
        ></rotomeca-toolbar-button>
      </div>
      <rds-icon-button
        id="up"
        variant="primary"
        square
        icon="chevron-up"
        label="Cacher la barre"
        data-i18n-label="toolbar.hide"
      ></rds-icon-button>
    </div>
    <div id="settings">
      <label data-i18n="settings.mode">Mode d'activation</label>
      <br />
      <rds-segmented-control id="mode" label="Mode d'activation" data-i18n-label="settings.mode">
        <option value="button" data-i18n="settings.modeButton">Bouton</option>
        <option value="mouse" data-i18n="settings.modeMouse">Souris à gauche</option>
      </rds-segmented-control>
      <div id="appbar-settings" class="setting-group" hidden>
        <rds-switch id="autohide" data-i18n="settings.appBarAutoHide">Masquer automatiquement</rds-switch>
      </div>
      <div class="setting-group">
        <rds-select id="theme" label="Thème" data-i18n-label="settings.theme">
          <option value="system" data-i18n="settings.themeSystem">Système</option>
          <option value="dark" data-i18n="settings.themeDark">Sombre</option>
          <option value="red" data-i18n="settings.themeRed">Rouge</option>
          <option value="blue" data-i18n="settings.themeBlue">Bleu</option>
          <option value="green" data-i18n="settings.themeGreen">Vert</option>
          <option value="white" data-i18n="settings.themeWhite">Blanc</option>
          <option value="black" data-i18n="settings.themeBlack">Noir</option>
        </rds-select>
      </div>
      <div id="display-setting" class="setting-group" hidden>
        <rds-select id="displays" label="Écran" data-i18n-label="settings.display"></rds-select>
      </div>
      <div class="setting-group">
        <label><span data-i18n="settings.version">Version :</span> <span id="app-version"></span></label>
      </div>
    </div>
  </body>
  <footer></footer>
</html>
