<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title data-i18n="window.settings">Paramètres</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background: var(--ds-body-background-color);
        color: var(--ds-text-default);
        font-family: var(--ds-font-sans);
      }

      #page {
        box-sizing: border-box;
        min-height: 100%;
        padding: 32px 40px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #badge {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ds-background-tone-brand);
        color: var(--ds-text-tone-brand);
        font-size: 24px;
      }

      #heading {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      h1 {
        margin: 0;
        font: var(--text-headline);
        letter-spacing: -0.01em;
      }

      .helper {
        margin: 0;
        font: var(--text-helper);
        color: var(--ds-text-muted);
      }

      #version {
        padding: 4px 10px;
        border-radius: var(--ds-radius-full, 999px);
        background: var(--ds-background-tone-neutral);
        color: var(--ds-text-tone-neutral);
        font: var(--text-caption);
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 24px;
        border-radius: var(--ds-radius-lg);
        /* légèrement transparent : laisse voir les effets de saison */
        background: color-mix(in srgb, var(--ds-background-surface-variant) 82%, transparent);
        border: 1px solid var(--ds-border-subtle);
      }

      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      /* Vignettes de thème */
      #themes {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }

      .tile {
        padding: 6px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        border-radius: var(--ds-input-radius);
        border: 2px solid var(--ds-border-subtle);
        background: var(--ds-background-surface);
        color: var(--ds-text-default);
        font-family: inherit;
        cursor: pointer;
      }

      .tile[aria-pressed='true'] {
        border-color: var(--ds-background-action-primary);
      }

      .tile:focus-visible {
        outline: 2px solid var(--ds-focus-ring-color);
        outline-offset: 2px;
      }

      .tile-name {
        min-height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font: var(--text-caption);
        text-align: center;
      }

      /* Aperçu : porte son propre data-theme / data-palette, les jetons s'y résolvent */
      .preview {
        height: 54px;
        border-radius: 6px;
        overflow: hidden;
        display: flex;
        background: var(--ds-body-background-color);
        border: 1px solid var(--ds-border-subtle);
      }

      .preview-bar {
        width: 14px;
        flex-shrink: 0;
        padding-top: 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        background: var(--ds-background-surface-variant);
      }

      .preview-bar > span {
        display: block;
        width: 7px;
        height: 7px;
        border-radius: var(--ds-radius-full, 999px);
        background: var(--ds-background-surface-strong);
      }

      .preview-bar > .pv-plus {
        border-radius: 2px;
        background: var(--ds-background-action-primary);
      }

      .preview-bar > .pv-sep {
        width: 6px;
        height: 2px;
        border-radius: 2px;
        background: var(--ds-background-tone-accent-bold);
      }

      .preview-body {
        flex-grow: 1;
        padding: 7px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .preview-body > .pv-l1 {
        height: 5px;
        width: 70%;
        border-radius: 3px;
        background: var(--ds-text-default);
      }

      .preview-body > .pv-l2 {
        height: 4px;
        width: 45%;
        border-radius: 3px;
        background: var(--ds-text-muted);
      }

      .preview-body > .pv-btn {
        margin-top: auto;
        align-self: flex-end;
        width: 18px;
        height: 8px;
        border-radius: 3px;
        background: var(--ds-background-action-primary);
      }

      /* Vignette « Système » : moitié claire, moitié sombre */
      .preview.split > .half {
        flex: 1;
        display: flex;
        background: var(--ds-body-background-color);
      }

      .preview.split > .half.dark {
        justify-content: flex-end;
        padding: 6px;
      }

      .preview.split .pv-btn {
        align-self: flex-end;
        width: 14px;
        height: 8px;
        border-radius: 3px;
        background: var(--ds-background-action-primary);
      }

      #season-options {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 16px;
        border-top: 1px solid var(--ds-border-subtle);
      }

      .season-row {
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
      }

      .density {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-grow: 1;
      }

      h2 {
        margin: 0;
        font: var(--text-title);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .label {
        font: var(--text-label);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        align-items: center;
      }

      [hidden] {
        display: none !important;
      }
    </style>
    <link
      rel="stylesheet"
      href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css"
    />
    <link rel="stylesheet" href="../css/ds-compat.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <link rel="stylesheet" href="../css/saisons.css" />
    <script src="../scripts/ds.js" type="module"></script>
    <script src="./settings.js" type="module"></script>
  </head>
  <body>
    <div id="page" class="fx-host">
      <header>
        <div id="badge" aria-hidden="true"><rds-icon name="settings"></rds-icon></div>
        <div id="heading">
          <h1 data-i18n="settings.title">Paramètres</h1>
          <p class="helper" data-i18n="settings.subtitle">Comportement et apparence de la barre d'outils</p>
        </div>
        <span id="version"></span>
      </header>

      <section aria-labelledby="sec-behavior">
        <h2 id="sec-behavior" data-i18n="settings.sectionBehavior">Comportement</h2>
        <div class="field">
          <span class="label" data-i18n="settings.mode">Mode d'activation</span>
          <rds-segmented-control id="mode" label="Mode d'activation" data-i18n-label="settings.mode" full>
            <option value="button" data-i18n="settings.modeButton">Bouton</option>
            <option value="mouse" data-i18n="settings.modeMouse">Souris à gauche</option>
          </rds-segmented-control>
          <span id="mode-help" class="helper"></span>
        </div>
        <div class="grid">
          <div id="display-setting" hidden>
            <rds-select id="displays" label="Écran" data-i18n-label="settings.display"></rds-select>
          </div>
          <div id="appbar-settings" hidden>
            <rds-switch id="autohide" icons data-i18n="settings.appBarAutoHide">Masquer automatiquement</rds-switch>
          </div>
        </div>
      </section>

      <section aria-labelledby="sec-appearance">
        <div class="card-head">
          <h2 id="sec-appearance" data-i18n="settings.sectionAppearance">Apparence</h2>
          <rds-segmented-control id="family" label="Famille de thèmes" data-i18n-label="settings.family"></rds-segmented-control>
        </div>
        <div id="themes" role="group" aria-label="Thème" data-i18n-aria-label="settings.themeGroup"></div>
        <div id="season-options" hidden>
          <div class="season-row">
            <rds-switch id="fx" icons data-i18n="settings.effects">Effets de saison</rds-switch>
            <div class="density">
              <span class="label" data-i18n="settings.density">Densité</span>
              <rds-segmented-control id="density" label="Densité des effets" data-i18n-label="settings.density" full>
                <option value="discrete" data-i18n="settings.densityDiscrete">Discrète</option>
                <option value="normale" data-i18n="settings.densityNormal">Normale</option>
                <option value="abondante" data-i18n="settings.densityAbundant">Abondante</option>
              </rds-segmented-control>
            </div>
          </div>
          <span class="helper" data-i18n="settings.effectsHelp">Neige, feuilles, pétales, tournesols ou traîneau selon la saison. Coupés si Windows réduit les animations.</span>
        </div>
      </section>
    </div>
  </body>
</html>
