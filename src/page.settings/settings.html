<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title data-i18n="window.settings">Paramètres</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background: var(--ds-body-background-color);
        color: var(--ds-text-default);
        font-family: var(--ds-font-sans);
      }

      #page {
        box-sizing: border-box;
        min-height: 100%;
        padding: 32px 40px;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      #badge {
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ds-background-tone-brand);
        color: var(--ds-text-tone-brand);
        font-size: 24px;
      }

      #heading {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }

      h1 {
        margin: 0;
        font: var(--text-headline);
        letter-spacing: -0.01em;
      }

      .helper {
        margin: 0;
        font: var(--text-helper);
        color: var(--ds-text-muted);
      }

      #version {
        padding: 4px 10px;
        border-radius: var(--ds-radius-full, 999px);
        background: var(--ds-background-tone-neutral);
        color: var(--ds-text-tone-neutral);
        font: var(--text-caption);
      }

      section {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 24px;
        border-radius: var(--ds-radius-lg);
        background: var(--ds-background-surface-variant);
        border: 1px solid var(--ds-border-subtle);
      }

      h2 {
        margin: 0;
        font: var(--text-title);
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .label {
        font: var(--text-label);
      }

      .rule {
        height: 1px;
        margin-bottom: 20px;
        background: var(--ds-border-subtle);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
    <link
      rel="stylesheet"
      href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css"
    />
    <link rel="stylesheet" href="../css/ds-compat.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <script src="../scripts/ds.js" type="module"></script>
    <script src="./settings.js" type="module"></script>
  </head>
  <body>
    <div id="page">
      <header>
        <div id="badge" aria-hidden="true"><rds-icon name="settings"></rds-icon></div>
        <div id="heading">
          <h1 data-i18n="settings.title">Paramètres</h1>
          <p class="helper" data-i18n="settings.subtitle">Comportement et apparence de la barre d'outils</p>
        </div>
        <span id="version"></span>
      </header>

      <section aria-labelledby="sec-behavior">
        <h2 id="sec-behavior" data-i18n="settings.sectionBehavior">Comportement</h2>
        <div class="field">
          <span class="label" data-i18n="settings.mode">Mode d'activation</span>
          <rds-segmented-control id="mode" label="Mode d'activation" data-i18n-label="settings.mode" full>
            <option value="button" data-i18n="settings.modeButton">Bouton</option>
            <option value="mouse" data-i18n="settings.modeMouse">Souris à gauche</option>
          </rds-segmented-control>
          <span id="mode-help" class="helper"></span>
        </div>
        <div id="appbar-settings" hidden>
          <div class="rule"></div>
          <rds-switch id="autohide" icons data-i18n="settings.appBarAutoHide">Masquer automatiquement</rds-switch>
        </div>
      </section>

      <section aria-labelledby="sec-display">
        <h2 id="sec-display" data-i18n="settings.sectionDisplay">Affichage</h2>
        <div class="grid">
          <rds-select id="theme" label="Thème" data-i18n-label="settings.theme">
            <option value="system" data-i18n="settings.themeSystem">Système</option>
            <option value="clair" data-i18n="settings.themeClair">Clair</option>
            <option value="sombre" data-i18n="settings.themeDark">Sombre</option>
            <option value="marron" data-i18n="settings.themeMarron">Marron</option>
            <option value="rouge" data-i18n="settings.themeRed">Rouge</option>
            <option value="bleu" data-i18n="settings.themeBlue">Bleu</option>
            <option value="vert" data-i18n="settings.themeGreen">Vert</option>
            <option value="sapin" data-i18n="settings.themeSapin">Vert sapin</option>
            <option value="blanc" data-i18n="settings.themeWhite">Blanc</option>
            <option value="noir" data-i18n="settings.themeBlack">Noir</option>
          </rds-select>
          <div id="display-setting" hidden>
            <rds-select id="displays" label="Écran" data-i18n-label="settings.display"></rds-select>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
