<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title>Applications</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: var(--color-scheme, #1f2933);
        color: var(--color-scheme-text, #c7dfff);
        user-select: none;
      }

      #header {
        box-sizing: border-box;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 4px;
        border-bottom: 1px solid var(--color-scheme-primary, #323f4b);
      }

      #title {
        flex: 1;
        min-width: 0;
        padding: 0 8px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: 12px;
        opacity: 0.8;
        text-align: center;
      }

      .group {
        display: flex;
        gap: 2px;
      }

      rds-icon-button::part(button) {
        width: 26px;
        min-width: 26px;
        height: 24px;
        min-height: 24px;
        padding: 0;
        border-radius: 6px;
      }

      #close:hover::part(button) {
        background-color: #d32f2f;
        color: #fff;
      }
    </style>
    <link rel="stylesheet" href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css" />
    <link rel="stylesheet" href="../../src/css/ds-bridge.css" />
    <link rel="stylesheet" href="./apps.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div id="header">
      <div class="group">
        <rds-icon-button
          id="refresh"
          icon="refresh-cw"
          label="Recharger la page"
          title="Recharger la page"
        ></rds-icon-button>
        <rds-icon-button
          id="open"
          icon="external-link"
          label="Arrêter et ouvrir dans le navigateur"
          title="Arrêter et ouvrir dans le navigateur"
        ></rds-icon-button>
      </div>
      <div id="title"></div>
      <div class="group">
        <rds-icon-button
          id="kill"
          icon="trash-2"
          label="Arrêter la fenêtre"
          title="Arrêter la fenêtre"
        ></rds-icon-button>
        <rds-icon-button
          id="close"
          icon="x"
          label="Fermer la fenêtre"
          title="Fermer la fenêtre"
        ></rds-icon-button>
      </div>
    </div>
  </body>
  <footer>
    <script></script>
  </footer>
</html>
