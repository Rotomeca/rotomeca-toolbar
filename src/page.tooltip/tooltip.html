<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Infobulle</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: flex;
        align-items: center;
        padding: 0 4px;
        box-sizing: border-box;
      }

      #tip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        max-width: 100%;
        box-sizing: border-box;
        padding: 8px 12px;
        border-radius: var(--ds-input-radius);
        background: var(--ds-background-overlay);
        border: 1px solid var(--ds-border-subtle);
        box-shadow: var(--ds-shadow-3);
        color: var(--ds-text-default);
        font: var(--text-label);
        white-space: nowrap;
      }

      #text {
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #badge {
        flex: none;
        padding: 0 8px;
        border-radius: var(--ds-radius-full, 999px);
        background: var(--ds-background-tone-accent);
        color: var(--ds-text-tone-accent);
        font: var(--text-caption);
        font-variant-numeric: tabular-nums;
      }

      [hidden] {
        display: none !important;
      }
    </style>
    <link
      rel="stylesheet"
      href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css"
    />
    <link rel="stylesheet" href="../css/ds-compat.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div id="tip" role="tooltip">
      <span id="text"></span>
      <span id="badge" hidden></span>
    </div>
  </body>
</html>
