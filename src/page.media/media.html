<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title data-i18n="media.title">Lecteur</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #player {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        gap: 10px;
        padding: 10px;
        align-items: center;
        border-radius: 10px;
        background-color: var(--color-scheme, #1f2933);
        color: var(--color-scheme-text, #c7dfff);
        font-family: sans-serif;
      }

      #cover {
        flex: none;
        width: 76px;
        height: 76px;
        border-radius: 8px;
        object-fit: cover;
        background-color: var(--color-scheme-primary, #323f4b);
      }

      #info {
        flex: 1;
        min-width: 0;
      }

      #title,
      #artist {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      #title {
        font-size: 14px;
        font-weight: bold;
      }

      #artist {
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 6px;
      }

      #bar {
        margin-bottom: 6px;
      }

      #bar[hidden] {
        display: none;
      }

      #controls {
        display: flex;
        gap: 4px;
      }

      #controls rds-icon-button::part(button) {
        width: 32px;
        min-width: 32px;
        height: 28px;
        min-height: 28px;
        border-radius: 6px;
      }
    </style>
    <link
      rel="stylesheet"
      href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css"
    />
    <link rel="stylesheet" href="../css/ds-bridge.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div id="player">
      <img id="cover" alt="" hidden />
      <div id="info">
        <div id="title"></div>
        <div id="artist"></div>
        <rds-progress id="bar" size="sm" label="Avancée du morceau" data-i18n-label="media.progress" hidden></rds-progress>
        <div id="controls">
          <rds-icon-button id="prev" variant="primary" icon="skip-back" label="Précédent" title="Précédent" data-i18n-label="media.previous" data-i18n-title="media.previous"></rds-icon-button>
          <rds-icon-button id="toggle" variant="primary" icon="play" label="Lecture / pause" title="Lecture / pause" data-i18n-label="media.play" data-i18n-title="media.play"></rds-icon-button>
          <rds-icon-button id="next" variant="primary" icon="skip-forward" label="Suivant" title="Suivant" data-i18n-label="media.next" data-i18n-title="media.next"></rds-icon-button>
          <rds-icon-button id="mute" variant="primary" icon="volume-2" label="Couper le son" title="Couper le son" data-i18n-label="media.mute" data-i18n-title="media.mute"></rds-icon-button>
        </div>
      </div>
    </div>
  </body>
</html>
