<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title data-i18n="media.title">Lecteur</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      #player {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 12px;
        border-radius: var(--ds-radius-lg);
        background: var(--ds-background-overlay);
        border: 1px solid var(--ds-border-subtle);
        box-shadow: var(--ds-shadow-3);
        color: var(--ds-text-default);
        font-family: var(--ds-font-sans);
      }

      #head {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      #cover,
      #cover-fallback {
        flex: none;
        box-sizing: border-box;
        width: 72px;
        height: 72px;
        border-radius: var(--ds-input-radius);
        object-fit: cover;
      }

      #cover-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ds-background-tone-brand);
        color: var(--ds-text-tone-brand);
        font-size: 28px;
      }

      #cover[hidden],
      #cover-fallback[hidden] {
        display: none;
      }

      #info {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      #title,
      #artist {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      /* Texte trop long : l'ellipse laisse place au défilement (voir marquee.ts) */
      #title.scrolling,
      #artist.scrolling {
        text-overflow: clip;
      }

      .scrolling .marquee-text {
        display: inline-block;
        animation: marquee var(--marquee-duration, 6s) ease-in-out infinite alternate;
      }

      /* Pause à chaque extrémité, défilement entre les deux ; `alternate` ramène le texte au début */
      @keyframes marquee {
        0%,
        20% {
          transform: translateX(0);
        }
        80%,
        100% {
          transform: translateX(var(--marquee-shift, 0));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scrolling .marquee-text {
          animation: none;
        }
      }

      #title {
        font: var(--text-label);
        font-size: 1rem;
      }

      #artist {
        font: var(--text-helper);
        color: var(--ds-text-muted);
      }

      #progress[hidden] {
        display: none;
      }

      #progress {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      #track {
        height: 4px;
        border-radius: var(--ds-radius-full, 999px);
        background: var(--ds-background-surface-strong);
        overflow: hidden;
      }

      #fill {
        height: 100%;
        width: 0;
        border-radius: var(--ds-radius-full, 999px);
        background: var(--ds-background-action-primary);
      }

      #times {
        display: flex;
        justify-content: space-between;
        font: var(--text-caption);
        color: var(--ds-text-muted);
        font-variant-numeric: tabular-nums;
      }

      #controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .divider {
        width: 1px;
        height: 24px;
        margin: 0 4px;
        background: var(--ds-border-subtle);
      }
    </style>
    <link
      rel="stylesheet"
      href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css"
    />
    <link rel="stylesheet" href="../css/ds-compat.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <section id="player" aria-label="Lecture en cours" data-i18n-aria-label="media.title">
      <div id="head">
        <img id="cover" alt="" hidden />
        <div id="cover-fallback" aria-hidden="true"><rds-icon name="music"></rds-icon></div>
        <div id="info">
          <span id="title"></span>
          <span id="artist"></span>
        </div>
      </div>
      <div id="progress" hidden>
        <div
          id="track"
          role="progressbar"
          aria-label="Avancée du morceau"
          data-i18n-aria-label="media.progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="fill"></div>
        </div>
        <div id="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
      </div>
      <div id="controls">
        <rds-icon-button id="prev" icon="skip-back" label="Précédent" title="Précédent" data-i18n-label="media.previous" data-i18n-title="media.previous"></rds-icon-button>
        <rds-icon-button id="toggle" variant="primary" size="lg" icon="play" label="Lecture / pause" title="Lecture / pause" data-i18n-label="media.play" data-i18n-title="media.play"></rds-icon-button>
        <rds-icon-button id="next" icon="skip-forward" label="Suivant" title="Suivant" data-i18n-label="media.next" data-i18n-title="media.next"></rds-icon-button>
        <div class="divider" aria-hidden="true"></div>
        <rds-icon-button id="mute" icon="volume-2" label="Couper le son" title="Couper le son" data-i18n-label="media.mute" data-i18n-title="media.mute"></rds-icon-button>
      </div>
    </section>
  </body>
</html>
