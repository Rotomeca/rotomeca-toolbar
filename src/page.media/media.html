<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Lecteur</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #player {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        gap: 10px;
        padding: 10px;
        align-items: center;
        border-radius: 10px;
        background-color: var(--color-scheme, #1f2933);
        color: var(--color-scheme-text, #c7dfff);
        font-family: sans-serif;
      }

      #cover {
        flex: none;
        width: 76px;
        height: 76px;
        border-radius: 8px;
        object-fit: cover;
        background-color: var(--color-scheme-primary, #323f4b);
      }

      #info {
        flex: 1;
        min-width: 0;
      }

      #title,
      #artist {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      #title {
        font-size: 14px;
        font-weight: bold;
      }

      #artist {
        font-size: 12px;
        opacity: 0.8;
        margin-bottom: 6px;
      }

      #controls {
        display: flex;
        gap: 4px;
      }

      button {
        width: 32px;
        height: 28px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        background-color: var(--color-scheme-primary, #323f4b);
        color: var(--color-scheme-text-primary, #c7dfff);
      }

      button:hover:not(:disabled) {
        background-color: var(--color-scheme-primary-hover, #96845f);
        color: var(--color-scheme-text-hover, #1f2933);
      }

      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
    </style>
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div id="player">
      <img id="cover" alt="" hidden />
      <div id="info">
        <div id="title"></div>
        <div id="artist"></div>
        <div id="controls">
          <button id="prev" type="button" title="Précédent">⏮</button>
          <button id="toggle" type="button" title="Lecture / pause">⏯</button>
          <button id="next" type="button" title="Suivant">⏭</button>
          <button id="mute" type="button" title="Couper le son">🔊</button>
        </div>
      </div>
    </div>
  </body>
</html>
