<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title>RotomecaToolbar</title>
    <link rel="stylesheet" href="./taskbar.css" />
    <link rel="stylesheet" href="../../node_modules/@rotomeca/design-system/out/rotomeca-design-system.css" />
    <link rel="stylesheet" href="../css/ds-compat.css" />
    <link rel="stylesheet" href="../css/themes.css" />
    <script type="module" src="../../src/scripts/ds.js"></script>
    <link rel="stylesheet" href="../css/fonts/icofont/icofont.min.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div id="main">
      <div id="head"></div>
      <rds-icon-button
        id="add-button"
        icon="plus"
        square
        variant="primary"
        label="Ajouter une application"
        data-i18n-label="toolbar.add"
      ></rds-icon-button>
      <div id="apps"></div>
      <div id="edit">
        <div class="separator" aria-hidden="true"></div>
        <rds-icon-button
          id="edit-button"
          toggle
          square
          icon="pencil"
          label="Modifier les applications"
          data-i18n-label="toolbar.edit"
        ></rds-icon-button>
        <rds-icon-button
          id="settings-button"
          square
          icon="settings"
          label="Paramètres"
          data-i18n-label="toolbar.settings"
        ></rds-icon-button>
      </div>
      <button
        type="button"
        id="rail-button"
        aria-label="Afficher la barre"
        data-i18n-label="toolbar.show"
        hidden
      >
        <rds-icon name="chevron-right"></rds-icon>
      </button>
    </div>
  </body>
  <footer></footer>
</html>
