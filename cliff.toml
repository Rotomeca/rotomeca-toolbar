# Configuration git-cliff : https://git-cliff.org/docs/configuration
# Génère le changelog à partir des commits (Conventional Commits + gitmoji),
# sans passer par des PR (workflow git flow local).

[changelog]
header = """
# Changelog
"""
body = """
{% if version %}\
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Non publié
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}** : {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
# Les tags de version n'ont pas de préfixe "v" (cf. gitflow.prefix.versiontag).
# Ancré : les pré-versions (X.Y.Z-rcN) ne sont pas des bornes, une release couvre
# donc tout ce qui s'est passé depuis la release finale précédente.
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"

# Retire les gitmojis (:sparkles:, :bug:...) des messages
commit_preprocessors = [
  { pattern = '\s*:[a-z0-9_+-]+:\s*', replace = ' ' },
  { pattern = '^(\w+(?:\([^)]*\))?!?:)\s+', replace = '$1 ' },
]

commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^build: .*\\d+\\.\\d+\\.\\d+(-rc\\d+)?\\s*$", skip = true },
  { message = "^app: \\d+\\.\\d+\\.\\d+(-rc\\d+)?\\s*$", skip = true },
  { message = "^feat(ure)?", group = "Nouveautés" },
  { message = "^fix", group = "Corrections" },
  { message = "^refactor", group = "Refactorisation" },
  { message = "^perf", group = "Performances" },
  { message = "^(doc|docs)", group = "Documentation" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = ".*", group = "Autres" },
]
