<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0"
    />
    <title>RotomecaToolbarAction</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #main {
        display: block;
        width: 100%;
        height: 100%;
      }

      #main::part(button) {
        width: 100%;
        height: 100%;
        border-radius: 5px 5px 0 0;
      }
    </style>
    <link rel="stylesheet" href="./src/index/index.css" />
    <link rel="stylesheet" href="./node_modules/@rotomeca/design-system/out/rotomeca-design-system.css" />
    <link rel="stylesheet" href="./src/css/ds-compat.css" />
    <link rel="stylesheet" href="./src/css/themes.css" />
    <script type="module" src="./src/scripts/ds.js"></script>
  </head>
  <body>
    <rds-icon-button
      id="main"
      toggle
      square
      variant="primary"
      icon="chevron-up"
      selected-icon="chevron-down"
      label="Afficher ou cacher la barre"
      data-i18n-label="toolbar.toggle"
    ></rds-icon-button>
  </body>
  <footer>
    <script src="./src/index/renderer.js" type="module"></script>
  </footer>
</html>
