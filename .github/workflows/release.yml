name: Release

# Déclenché par un tag de version (ex: 2.1.0) poussé, typiquement sur main
# après `git flow release finish`. Le serveur Hazel (Vercel) lit ensuite
# la dernière release GitHub pour proposer la mise à jour via Squirrel.
# La release contient Windows (Squirrel) et Linux (deb + rpm).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (doit exister)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vérifier que le tag correspond à package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG différent de la version package.json ($VERSION)"
            exit 1
          fi

      - name: Installer les outils de packaging Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      - name: Build
        run: pnpm run make

      - name: Envoyer les fichiers Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: make-windows
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          if-no-files-found: error

      - name: Envoyer les fichiers Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: make-linux
          path: |
            out/make/deb/x64/*.deb
            out/make/rpm/x64/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # git-cliff a besoin de l'historique et des tags

      - name: Générer les notes de release (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Créer la release et envoyer les fichiers
        run: |
          ls dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag
          fi
