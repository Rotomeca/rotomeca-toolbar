name: Release

# Déclenché par un tag poussé. La release contient Windows (Squirrel) et Linux
# (deb + rpm).
#
# Deux sortes de tags :
#   - X.Y.Z (ex: 2.1.0), typiquement sur main après `git flow release finish` :
#     vraie release, publiée directement. Le serveur Hazel (Vercel) la propose
#     alors à tous les utilisateurs.
#   - X.Y.Z-rcN (ex: 2.1.0-rc1), créé par `pnpm pre-release` sur une branche
#     `pre-release/` : PRÉ-VERSION, que Hazel et `releases/latest` ignorent.
#     Personne ne la reçoit automatiquement ; elle s'installe depuis
#     Paramètres > Version de test.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (doit exister)'
        required: true

permissions:
  contents: write

jobs:
  # Garde-fou : aucune release n'est construite si le lint ou les tests échouent.
  lint:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 épinglé : rpm >= 4.20 (ubuntu-latest récent) casse
        # electron-installer-redhat (« cp: cannot stat 'usr/*' »)
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vérifier que le tag correspond à package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$TAG" ]; then
            echo "Tag $TAG différent de la version package.json ($VERSION)"
            exit 1
          fi

      - name: Installer les outils de packaging Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      # Signature Authenticode : définir les secrets WINDOWS_CERTIFICATE_BASE64
      # (certificat .pfx encodé en base64) et WINDOWS_CERTIFICATE_PASSWORD.
      # Sans eux, l'installeur Windows est produit non signé.
      - name: Préparer le certificat de signature Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ]; then
            echo "::warning::Pas de certificat de signature : installeur Windows non signé"
            exit 0
          fi
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/codesign.pfx"
          echo "WINDOWS_CERTIFICATE_FILE=$RUNNER_TEMP/codesign.pfx" >> "$GITHUB_ENV"
          echo "WINDOWS_CERTIFICATE_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"

      - name: Build
        run: pnpm run make

      - name: Supprimer le certificat de signature
        if: always() && runner.os == 'Windows'
        shell: bash
        run: rm -f "$RUNNER_TEMP/codesign.pfx"

      - name: Envoyer les fichiers Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: make-windows
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          if-no-files-found: error

      - name: Envoyer les fichiers Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: make-linux
          path: |
            out/make/deb/x64/*.deb
            out/make/rpm/x64/*.rpm
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # git-cliff a besoin de l'historique et des tags

      - name: Générer les notes de release (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          # Release finale : du tag final précédent à ce tag. Pré-version : son tag
          # n'est pas reconnu par cliff.toml, on décrit donc ce qui n'est pas encore
          # sorti (depuis le dernier tag final) en le nommant avec le tag de la RC.
          args: --strip header ${{ contains(env.TAG, '-') && format('--unreleased --tag {0}', env.TAG) || '--latest' }}
        env:
          OUTPUT: RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Créer la release et envoyer les fichiers
        run: |
          # Les artefacts Linux gardent leurs sous-dossiers (deb/x64, rpm/x64) :
          # on liste uniquement les fichiers, pas les dossiers.
          mapfile -t FILES < <(find dist -type f)
          printf '%s\n' "${FILES[@]}"

          # Un tag avec un suffixe (-rcN) est une pré-version, sinon c'est une release
          KIND=()
          if [[ "$TAG" == *-* ]]; then KIND=(--prerelease); fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TAG" --notes-file RELEASE_NOTES.md --verify-tag \
              "${KIND[@]}"
          fi
